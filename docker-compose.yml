# ==============================================================================
# Evara Local Self-Hosted Stack
# Runs 100% locally with zero cloud costs, zero subscriptions, zero billing risk
# ==============================================================================

services:
  # Evara Full-Stack Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evara_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mysql://evara_user:evara_password@db:3306/evara_db
      - SESSION_SECRET=local-development-secret-key-32-chars-minimum
      - AI_PROVIDER=ollama
      - AI_BASE_URL=http://host.docker.internal:11434/v1
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=evara-local
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/app/.storage/uploads

  # Free Local MySQL Database
  db:
    image: mysql:8.0
    container_name: evara_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: evara_db
      MYSQL_USER: evara_user
      MYSQL_PASSWORD: evara_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional S3-compatible local MinIO object storage
  minio:
    image: minio/minio:latest
    container_name: evara_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  db_data:
  storage_data:
  minio_data:
