name: Automated Encrypted Database Backup to R2

on:
  schedule:
    # Run daily at 02:00 UTC (off-peak hours)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions

jobs:
  backup:
    name: Backup, Encrypt & Upload to Cloudflare R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm@10.4.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Execute Encrypted Backup & Upload to Cloudflare R2
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET || 'evara-backups' }}
          BACKUP_RETENTION_DAYS: 7
          SAVE_LOCAL_COPY: 'false'
        run: |
          echo "Starting automated encrypted backup to Cloudflare R2..."
          node scripts/backup-r2.cjs

      - name: Verify Runner Cleanup (Zero Data Leakage)
        run: |
          echo "Ensuring no temporary database dump files remain on runner disk..."
          FOUND=$(find . -name "*.sql" -o -name "*.sql.gz" -o -name "*.sql.gz.enc" 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "::warning::Cleaning up temporary files: $FOUND"
            rm -f $FOUND
          fi
          echo "Runner disk verified clean. Zero artifacts retained."
